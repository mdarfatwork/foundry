# =====================================================================
# Foundry SonarQube Configuration (sonar-project.properties)
# Single Source of Truth for Static Analysis & Clean Code Quality Gate
# =====================================================================

# Project Identification
sonar.projectKey=foundry
sonar.projectName=Foundry
sonar.projectVersion=0.1.0

# Source & Test Code Base
sonar.sources=app,components,hooks,lib
sonar.tests=
sonar.sourceEncoding=UTF-8

# Code Coverage & Analysis Reports
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=tsconfig.json

# File Exclusions (Only vendor, dependencies, and build outputs - never application code)
sonar.exclusions=**/node_modules/**,.next/**,out/**,build/**,public/**,.agents/**,**/*.d.ts

# Strict Enforcement: Track and prohibit inline suppressions
# Rule typescript:S1291 flags any use of // NOSONAR comments
sonar.issue.ignore.multicriteria=

